services:
  - type: web
    name: sh-portfolio-proxy
    env: node
    plan: free
    startCommand: node server.js
    envVars:
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.1:8b
      - key: ALLOWED_ORIGINS
        value: https://serhii-hordiichuk.github.io
