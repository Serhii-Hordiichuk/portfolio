name: preview
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --check server.js && node --check api/_lib.js && node --check api/health.js && node --check api/chat.js
      - run: node -e "const v=require('./vercel.json');console.log('vercel.json ok')"
